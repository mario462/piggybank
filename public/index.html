<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Piggy</title>
  <meta name="theme-color" content="#0B0B0C">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Piggy">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="icon" href="/icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png">
  <link rel="preload" href="/fonts/geist-300.woff2" as="font" type="font/woff2" crossorigin>
  <link rel="stylesheet" href="/css/app.css">
  <script type="module" src="/js/app.js"></script>
</head>
<body>
  <div class="app">
    <section class="view" id="home">
      <div class="bar">
        <div class="brand"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18.6 10.2c-.9-2.4-3.5-3.9-6.8-3.9-4.1 0-7.2 2.4-7.2 5.8 0 1.9 1 3.5 2.6 4.5v2.4h2.3v-1.6c.7.2 1.5.3 2.3.3s1.6-.1 2.3-.3v1.6h2.3v-2.4c.9-.6 1.6-1.3 2.1-2.2h1.1c.6 0 1-.4 1-1v-2.2c0-.6-.4-1-1-1h-1z"/>
          <path d="M13.4 6.5c.5-1.3 1.6-2.2 2.9-2.3.3 1.2 0 2.4-.7 3.3"/><path d="M4.7 11.2c-1 0-1.9-.7-1.9-1.6 0-.5.3-.9.8-1"/><path d="M9.6 8.9h3"/>
          <circle cx="16.4" cy="10.4" r=".75" fill="currentColor" stroke="none"/></svg>Piggy</div>
        <div class="bar-r">
          <button class="sync" id="sync" data-s="idle" aria-live="polite"></button>
          <button class="icon-btn" id="menuBtn" aria-label="Menu"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"><path d="M5 8h14M5 16h14"/></svg></button>
        </div>
      </div>
      <div class="empty" id="emptyState" hidden>
        <div class="label">Welcome</div>
        <p>Create a category for each thing you are saving towards.</p>
        <button class="btn" id="firstCat">Create your first category</button>
      </div>
      <div id="overview">
        <div class="bal">
          <div class="label">Balance</div>
          <div class="total" id="total"></div>
          <div class="meta" id="meta"></div>
        </div>
        <div class="chart" id="chart"></div>
        <div class="alloc"><div class="label">Allocation</div><div class="alloc-bar" id="alloc"></div></div>
        <div class="sec-h"><span class="label">Categories</span></div>
        <p class="swipe-hint" id="swipeHint">Swipe a category left to mark it done.</p>
        <div id="cats"></div>
        <div class="sec-h"><span class="label">Recent</span><button class="link" id="seeall">See all</button></div>
        <div id="recent"></div>
      </div>
    </section>
    <section class="view off-right" id="activity">
      <button class="back" id="back"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M15 5l-7 7 7 7"/></svg>Overview</button>
      <h2 class="page-h">Activity</h2>
      <div class="filters" id="filters"></div>
      <div id="hist"></div>
    </section>
    <div class="actions"><div>
      <button id="bAdd">Add</button><button id="bOut">Withdraw</button><button id="bMove">Move</button>
    </div></div>
  </div>
</body>
</html>
